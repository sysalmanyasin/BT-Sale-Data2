# Supabase CLI config — pins per-function JWT settings so CI deploys never
# silently flip them. Project: wetbugzzchkghpzmowod (BT SALE DATA / Closing).
project_id = "wetbugzzchkghpzmowod"

# AI agent: JWT required (it also checks bt_authorized_users in code).
[functions.bt-agent]
verify_jwt = true

# Inventory Search companions are public (no login step in that PWA).
# These were deployed with verify_jwt=false; keep them that way.
[functions.inventory-chat]
verify_jwt = false

[functions.medicine-ai-info]
verify_jwt = false

# LEGACY (WhatsApp era): not deployed in production any more, kept only for reference.
[functions.send-daily-whatsapp-briefing]
verify_jwt = false

# Daily briefing (pg_cron 11:00 + 23:00 PKT, x-cron-secret header) and closing alerts (DB triggers, Bearer secret).
[functions.send-daily-ntfy-briefing]
verify_jwt = false

[functions.closing-ntfy-notify]
verify_jwt = false

name: Deploy to Supabase

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/supabase-deploy.yml"
  workflow_dispatch:
    inputs:
      functions:
        description: "Functions to deploy: all or comma-separated names. Empty = none."
        required: false
        default: ""
      migrations:
        description: "Migration filenames to apply (comma-separated). Empty = none."
        required: false
        default: ""

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT_REF: wetbugzzchkghpzmowod

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Plan deployment
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          IN_FUNCS: ${{ github.event.inputs.functions }}
          IN_MIGS: ${{ github.event.inputs.migrations }}
        shell: bash
        run: |
          set -euo pipefail
          funcs=""
          migs=""
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            if [[ "$IN_FUNCS" == "all" ]]; then
              funcs=$(find supabase/functions -mindepth 1 -maxdepth 1 -type d ! -name '_*' -printf '%f ')
            else
              funcs=$(tr ',' ' ' <<< "$IN_FUNCS")
            fi
            migs=$(tr ',' ' ' <<< "$IN_MIGS")
          else
            if [[ -z "$BEFORE" || "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
              RANGE="HEAD~1..HEAD"
            else
              RANGE="$BEFORE..HEAD"
            fi
            changed=$(git diff --name-only "$RANGE" || true)
            added=$(git diff --diff-filter=A --name-only "$RANGE" || true)
            funcs=$(printf '%s\n' "$changed" | grep -E '^supabase/functions/[^/]+/' | cut -d/ -f3 | sort -u | tr '\n' ' ' || true)
            if printf '%s\n' "$changed" | grep -qx 'supabase/config.toml'; then
              funcs=$(find supabase/functions -mindepth 1 -maxdepth 1 -type d ! -name '_*' -printf '%f ')
            fi

            migration_paths=$(printf '%s\n' "$changed" | grep -E '^supabase/migrations/.+\.sql$' || true)
            for path in $migration_paths; do
              if ! printf '%s\n' "$added" | grep -Fxq "$path"; then
                echo "::error::Historical migration files are immutable. Do not edit or delete an applied migration; add a new timestamped migration instead: $path"
                exit 1
              fi
            done
            migs=$(printf '%s\n' "$added" | grep -E '^supabase/migrations/.+\.sql$' | xargs -r -n1 basename | sort | tr '\n' ' ' || true)
          fi
          echo "functions=$(xargs <<< "$funcs")" >> "$GITHUB_OUTPUT"
          echo "migrations=$(xargs <<< "$migs")" >> "$GITHUB_OUTPUT"
          echo "Functions: $funcs"
          echo "Migrations: $migs"

      - name: Check required secrets
        id: check
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DBURL: ${{ secrets.SUPABASE_DB_URL }}
          FUNCS: ${{ steps.plan.outputs.functions }}
          MIGS: ${{ steps.plan.outputs.migrations }}
        run: |
          skip_funcs=false
          skip_migs=false
          if [[ -n "$FUNCS" && -z "$TOKEN" ]]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN missing; Edge Function deploy skipped."
            skip_funcs=true
          fi
          if [[ -n "$MIGS" && -z "$DBURL" ]]; then
            echo "::warning::SUPABASE_DB_URL missing; migrations skipped."
            skip_migs=true
          fi
          echo "skip_funcs=$skip_funcs" >> "$GITHUB_OUTPUT"
          echo "skip_migs=$skip_migs" >> "$GITHUB_OUTPUT"

      - name: Apply new migrations
        if: steps.plan.outputs.migrations != '' && steps.check.outputs.skip_migs != 'true'
        env:
          DBURL: ${{ secrets.SUPABASE_DB_URL }}
          MIGS: ${{ steps.plan.outputs.migrations }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client >/dev/null
          psql "$DBURL" -v ON_ERROR_STOP=1 -tAc 'select 1' >/dev/null
          for f in $MIGS; do
            version="${f%%_*}"
            applied=$(psql "$DBURL" -v ON_ERROR_STOP=1 -tAc "select 1 from supabase_migrations.schema_migrations where version = '$version' limit 1")
            if [[ "$applied" == "1" ]]; then
              echo "skip $f (migration $version is already recorded in Supabase)"
              continue
            fi
            echo "Applying $f"
            psql "$DBURL" -v ON_ERROR_STOP=1 --single-transaction -f "supabase/migrations/$f"
          done

      - name: Set up Supabase CLI
        if: steps.plan.outputs.functions != '' && steps.check.outputs.skip_funcs != 'true'
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Deploy Edge Functions from tracked repository source
        if: steps.plan.outputs.functions != '' && steps.check.outputs.skip_funcs != 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FUNCS: ${{ steps.plan.outputs.functions }}
        run: |
          set -euo pipefail
          for fn in $FUNCS; do
            if [[ -f "supabase/functions/$fn/index.ts" ]]; then
              supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
            else
              echo "::error::Function source missing from repository: $fn"
              exit 1
            fi
          done

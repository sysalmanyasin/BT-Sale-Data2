name: Build Inventory Widget APK

# Builds android-widget/ into a debug APK on every push that touches it,
# and lets you trigger it manually too. The APK is a downloadable build
# artifact on the finished run (Actions tab -> this run -> Artifacts) —
# no Android Studio needed for this, just download and side-load it.
#
# This produces a DEBUG build, signed with Android's auto-generated
# debug keystore. That's the right thing for installing on your own
# phone(s) directly. It is NOT suitable for a Google Play listing —
# that needs a release build signed with your own keystore, which is a
# separate step to add later if you ever want that distribution route.

on:
  push:
    paths:
      - 'android-widget/**'
      - '.github/workflows/android-widget-build.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-widget

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Installs the Android SDK components this project needs and
      # accepts the SDK licenses non-interactively — CI runners don't
      # have a full Android SDK/license set pre-accepted by default,
      # and a Gradle build will fail on an unaccepted license prompt
      # without this.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: inventory-widget-debug-apk
          path: android-widget/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

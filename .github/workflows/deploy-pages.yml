name: Deploy Pages

# The site was previously deployed by GitHub's legacy, non-Actions Pages
# builder (which runs everything through Jekyll whether the site needs it
# or not, and gives no useful logs beyond "Page build failed" when it
# errors — which is what had been happening on every push). This site is
# a hand-built static app with no Jekyll dependency, so this workflow
# uploads it as-is instead and lets GitHub Pages serve it directly.
#
# NOTE: for this workflow to actually take over deployment, the repo's
# Pages source (Settings → Pages → Build and deployment → Source) must be
# set to "GitHub Actions" rather than "Deploy from a branch". Until that's
# switched, the legacy builder keeps running in parallel.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Serve the whole repo root as-is (index.html, js/, css/, etc.)
          # — everything else the repo needs (android-widget build output,
          # Supabase config) lives outside what the site actually loads.
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

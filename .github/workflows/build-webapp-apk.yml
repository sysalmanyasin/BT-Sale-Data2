name: Build BT Sales App APK

on:
  push:
    branches: [main]
    paths:
      - "android-webapp/**"
      - ".github/workflows/build-webapp-apk.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-webapp

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Set up Android SDK
        env:
          ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
        run: |
          set -e
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -sSL -o cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Build debug APK
        id: build
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon \
            -PappVersionCode=${{ github.run_number }} 2>&1 | tee gradle-output.log
        continue-on-error: true

      - name: Post failure log as a commit comment
        if: steps.build.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          tail -c 55000 gradle-output.log > gradle-output-trimmed.log
          python3 - << 'PYEOF'
          import json, os, urllib.request
          body = open('gradle-output-trimmed.log').read()
          payload = json.dumps({
              "body": "**Build debug APK failed** — automated log excerpt (last ~55KB):\n\n```\n" + body + "\n```"
          }).encode()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/commits/{os.environ['SHA']}/comments",
              data=payload, method="POST",
              headers={
                  "Authorization": f"token {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(req) as resp:
              print(resp.status, resp.read().decode())
          PYEOF

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bt-sales-app-debug-apk
          path: android-webapp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Only runs once RELEASE_KEYSTORE_BASE64 and friends are added as
      # repo secrets (Settings → Secrets and variables → Actions). Until
      # then this step is skipped and only the debug APK above is built —
      # nothing here breaks the existing pipeline.
      - name: Decode release keystore
        id: decode_keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/release.keystore
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        if: steps.decode_keystore.outputs.present == 'true'
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon \
            -PappVersionCode=${{ github.run_number }}

      - name: Upload release APK artifact
        if: steps.decode_keystore.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bt-sales-app-release-apk
          path: android-webapp/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

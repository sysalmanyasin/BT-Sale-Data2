name: Build MailRoutine APK

# Debug build + unit tests run on MailRoutine changes, including the API-36/Groq upgrade branch, and on demand.
# The signed release job is separate, runs only after tests and the debug build pass, and is the
# ONLY place signing secrets are available (via the protected "mailroutine-release" environment).
on:
  push:
    branches: [main, feature/mailroutine-api36-groq-ai]
    paths:
      - "android-mailroutine/**"
      - ".github/workflows/build-mailroutine-apk.yml"
    tags:
      - "mailroutine-v*"
  pull_request:
    paths:
      - "android-mailroutine/**"
      - ".github/workflows/build-mailroutine-apk.yml"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Also build and publish a signed release (needs the mailroutine-release environment secrets)"
        type: boolean
        default: false
      version_name:
        description: "Release version name, e.g. 1.0.0 (ignored for tag pushes)"
        type: string
        default: "1.2.0"

permissions:
  contents: read

concurrency:
  group: mailroutine-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-mailroutine

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Ensure Android SDK packages
        run: |
          # GitHub-hosted runners ship an Android SDK; make sure the exact packages we compile against exist.
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Unit tests
        shell: bash
        run: gradle --no-daemon --console=plain --stacktrace testDebugUnitTest 2>&1 | tee "$RUNNER_TEMP/gradle-test.log"

      - name: Build debug APK
        shell: bash
        run: gradle --no-daemon --console=plain --stacktrace assembleDebug -PappVersionCode=${{ github.run_number }} 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"

      - name: Summarise Gradle failure
        if: failure()
        shell: bash
        run: |
          # Surface the real compiler/test errors as a job annotation and in the step summary,
          # so a failure can be diagnosed without downloading the full log.
          for f in "$RUNNER_TEMP/gradle-test.log" "$RUNNER_TEMP/gradle-build.log"; do
            [ -f "$f" ] || continue
            MSG=$(grep -E -A4 '^e: |What went wrong|Execution failed|Could not |error:|Unresolved|Caused by:|FAILED$|AssertionError' "$f" | head -c 55000 || true)
            [ -n "$MSG" ] || continue
            { echo "### $(basename "$f")"; echo '```'; echo "$MSG"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            ENC="${MSG//'%'/'%25'}"; ENC="${ENC//$'\r'/'%0D'}"; ENC="${ENC//$'\n'/'%0A'}"
            echo "::error title=Gradle failure ($(basename "$f"))::$ENC"
          done

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mailroutine-test-reports
          path: android-mailroutine/app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mailroutine-debug-apk
          path: android-mailroutine/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload exported Room schema
        uses: actions/upload-artifact@v4
        with:
          name: mailroutine-room-schemas
          path: android-mailroutine/app/schemas/
          if-no-files-found: warn
          retention-days: 30

  release:
    name: Signed release APK
    needs: build
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_release) || startsWith(github.ref, 'refs/tags/mailroutine-v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Protect this environment in repo settings (required reviewers, restrict to main/tags) and
    # store the signing secrets on the ENVIRONMENT, not as repository-wide secrets.
    environment: mailroutine-release
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android-mailroutine

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Ensure Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Resolve version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/mailroutine-v* ]]; then
            V="${GITHUB_REF_NAME#mailroutine-v}"
          else
            V="${{ inputs.version_name }}"
          fi
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Invalid version '$V'"; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.MAILROUTINE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::MAILROUTINE_KEYSTORE_BASE64 is not set on the mailroutine-release environment"; exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mailroutine-release.jks"
          chmod 600 "$RUNNER_TEMP/mailroutine-release.jks"

      - name: Build signed release APK
        env:
          MAILROUTINE_KEYSTORE_PATH: ${{ runner.temp }}/mailroutine-release.jks
          MAILROUTINE_KEYSTORE_PASSWORD: ${{ secrets.MAILROUTINE_KEYSTORE_PASSWORD }}
          MAILROUTINE_KEY_ALIAS: ${{ secrets.MAILROUTINE_KEY_ALIAS }}
          MAILROUTINE_KEY_PASSWORD: ${{ secrets.MAILROUTINE_KEY_PASSWORD }}
        run: >
          gradle --no-daemon --stacktrace assembleRelease
          -PappVersionCode=${{ github.run_number }}
          -PappVersionName=${{ steps.ver.outputs.version }}

      - name: Verify signature
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/mailroutine-release.jks"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: mailroutine-release-apk
          path: android-mailroutine/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: mailroutine-v${{ steps.ver.outputs.version }}
        run: |
          gh release create "$TAG" "$APK" --draft --target "$GITHUB_SHA" \
            --title "MailRoutine ${{ steps.ver.outputs.version }}" \
            --notes "Signed MailRoutine release. Register this APK's signing certificate SHA-1 in the Google Cloud Android OAuth client before using Gmail sending. See android-mailroutine/README.md." \
            || echo "::warning::Release $TAG already exists; the APK is still available as a workflow artifact."

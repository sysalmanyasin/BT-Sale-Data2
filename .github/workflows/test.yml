name: test
on:
  push: { branches: [main] }
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint            # zero errors AND zero warnings
      - run: npm run build:check     # stamps + cache version up to date
      - run: npm run bundle:check    # every module entry resolves under a real bundler
      - run: npm run test:coverage   # full suite + coverage floor (lines 68 / branches 72 / functions 65)

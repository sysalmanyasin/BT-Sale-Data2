<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Backgroundless, single-shape companion to icon.svg — same capsule +
       rising-bars motif, no gradient/background rect. Used everywhere as
       a CSS mask-image (not a plain background-image), so the actual fill
       color here is irrelevant — only the alpha/shape matters — and every
       consumer picks its own watermark color via background-color on the
       masked element (hero banners, login screen, empty states each want
       a different tint). Keep in sync with icon.svg's shapes if those
       ever change. -->
  <g fill="#000">
    <rect x="120" y="185" width="270" height="120" rx="60" ry="60" transform="rotate(-40 255 245)"/>
    <rect x="150" y="345" width="30" height="55" rx="6"/>
    <rect x="195" y="325" width="30" height="75" rx="6"/>
    <rect x="240" y="300" width="30" height="100" rx="6"/>
    <rect x="285" y="280" width="30" height="120" rx="6"/>
    <rect x="330" y="345" width="30" height="55" rx="6"/>
  </g>
</svg>

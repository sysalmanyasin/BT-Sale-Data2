<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- Fuel pump body -->
  <g fill="none" stroke="#ffffff" stroke-width="18" stroke-linejoin="round" stroke-linecap="round">
    <rect x="120" y="150" width="150" height="230" rx="16" fill="#ffffff" fill-opacity="0.12"/>
    <rect x="145" y="180" width="100" height="90" rx="8" fill="#ffffff" fill-opacity="0.18"/>
    <!-- nozzle hose -->
    <path d="M270 230 h40 a16 16 0 0 1 16 16 v70" />
    <path d="M326 316 l-22 26" />
  </g>

  <!-- Base plate -->
  <rect x="105" y="380" width="180" height="18" rx="9" fill="#ffffff"/>

  <!-- Rising sales bars (data / intelligence motif) -->
  <g fill="#facc15">
    <rect x="330" y="300" width="34" height="80" rx="6"/>
    <rect x="374" y="260" width="34" height="120" rx="6"/>
    <rect x="418" y="215" width="34" height="165" rx="6"/>
  </g>
</svg>
